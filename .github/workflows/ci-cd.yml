name: Hybrid CI/CD Pipeline
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests
      - run: python -m pytest Test/api_test

  selenium-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1         
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest robotframework-seleniumlibrary selenium
      - run: python -m pytest Test/selenium_tests

  robot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install robotframework
      - run: python -m robot Test/robot_test

  deploy:
    runs-on: ubuntu-latest
    needs: [api-tests, selenium-tests, robot-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploying application..."
