name: Hybrid CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - uses: actions/setup-python@main
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest robotframework robotframework-seleniumlibrary selenium requests

      - name: Verify installation
        run: |
          pip list
          python -m pytest --version
          python -m robot --version

  api-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: python -m pytest tests/api_tests

  selenium-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: python -m pytest tests/selenium_tests

  robot-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: python -m robot tests/robot_tests

  deploy:
    runs-on: ubuntu-latest
    needs: [api-tests, selenium-tests, robot-tests]
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        run: echo "Deploying application..."
