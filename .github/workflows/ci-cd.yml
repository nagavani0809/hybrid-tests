name: Hybrid CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt

  api-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: pytest tests/api_tests

  selenium-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: pytest tests/selenium_tests

  robot-tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v3
      - run: robot tests/robot_tests

  deploy:
    runs-on: ubuntu-latest
    needs: [api-tests, selenium-tests, robot-tests]
    steps:
      - uses: actions/checkout@v3
      - name: Deploy
        run: echo "Deploying application..."
